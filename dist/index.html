<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern Angular Unit Testing with Jest and Testing Library</title>
  <meta name="description" content="Modern Angular Unit Testing with Jest and Testing Library presentation deck." />
  
  <!-- Modern Typography Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="./assets/favicon-_WMvCRSc.png" />
  
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <script type="module" crossorigin src="./assets/index-BoJw2LVu.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-0J5WLYp0.css">
</head>
<body class="theme-clean-studio transition-slide">

  <div id="app" class="presentation-wrapper">
    <!-- Top Toolbar Header -->
    <header class="app-header glass-nav" id="app-header">
      <div class="header-left">
        <div class="logo-box">
          <span class="logo-icon">⚡</span>
          <div class="logo-text">
            <span class="brand-name">Knowledge Nexus</span>
            <span class="brand-sub">Presentation Deck</span>
          </div>
        </div>
        <div class="slide-count-badge" id="slide-count-badge">
          Slide <span id="current-index-num">1</span> / <span id="total-slides-num">17</span>
        </div>
      </div>

      <div class="header-center">
        <div class="deck-title-display" id="deck-title-display">
          Modern Angular Unit Testing with Jest and Testing Library
        </div>
      </div>

      <div class="header-right">
        <!-- Controls & Tools -->
        <div class="toolbar-actions">
          <div class="select-group">
            <label for="theme-select"><i class="ph ph-palette"></i></label>
            <select id="theme-select" title="Change Visual Theme">
              <option value="theme-clean-studio" selected>☀️ Clean Studio</option>
              <option value="theme-cyber-neon">🌌 Cyber Neon</option>
              <option value="theme-executive-slate">💼 Executive Slate</option>
              <option value="theme-midnight-blue">🫐 Midnight Blue</option>
            </select>
          </div>

          <div class="select-group">
            <label for="transition-select"><i class="ph ph-sparkle"></i></label>
            <select id="transition-select" title="Change Transition Animation">
              <option value="transition-slide" selected>Horizontal Slide</option>
              <option value="transition-fade">Smooth Fade</option>
              <option value="transition-scale">Zoom 3D Depth</option>
              <option value="transition-flip">Card Flip</option>
            </select>
          </div>

          <button id="btn-grid" class="btn-icon" title="Slide Overview Grid (Shortcut: O)">
            <i class="ph ph-grid-four"></i>
          </button>
          
          <button id="btn-notes" class="btn-icon" title="Speaker Notes (Shortcut: N)">
            <i class="ph ph-note-pencil"></i>
          </button>

          <button id="btn-edit" class="btn-icon" title="Edit Slide Content">
            <i class="ph ph-pencil-simple"></i>
          </button>

          <button id="btn-print" class="btn-icon" title="Export / Print PDF">
            <i class="ph ph-printer"></i>
          </button>

          <button id="btn-fullscreen" class="btn-icon" title="Fullscreen (Shortcut: F)">
            <i class="ph ph-corners-out"></i>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Presentation Stage -->
    <main class="presentation-stage">
      <!-- Side Navigation Click Areas -->
      <button class="nav-side-btn nav-prev-side" id="nav-prev-side" title="Previous Slide (Left Arrow)">
        <i class="ph ph-caret-left"></i>
      </button>

      <!-- Active Slide Container Frame -->
      <div class="slide-viewport-frame" id="slide-viewport-frame">
        <article class="slide-card glass-slide" id="active-slide-card">
          <!-- Slide Inner Dynamic Content Rendered Here -->
        </article>
      </div>

      <button class="nav-side-btn nav-next-side" id="nav-next-side" title="Next Slide (Right Arrow / Space)">
        <i class="ph ph-caret-right"></i>
      </button>

      <!-- Speaker Notes Side Drawer -->
      <aside class="speaker-notes-drawer glass-drawer" id="speaker-notes-drawer">
        <div class="drawer-header">
          <h3><i class="ph ph-note-pencil"></i> Presenter Notes</h3>
          <button id="btn-close-notes" class="btn-close">&times;</button>
        </div>
        <div class="drawer-timer">
          <span><i class="ph ph-clock"></i> Presentation Time:</span>
          <strong id="timer-display">00:00</strong>
          <button id="btn-reset-timer" class="btn-tiny">Reset</button>
        </div>
        <div class="drawer-body">
          <div class="notes-slide-title" id="notes-slide-title">Slide 1</div>
          <div class="notes-content" id="notes-content">Notes will appear here...</div>
        </div>
      </aside>
    </main>

    <!-- Bottom Controls & Progress Bar -->
    <footer class="app-footer glass-footer">
      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progress-bar-fill" style="width: 5%;"></div>
      </div>

      <div class="footer-bar">
        <div class="footer-left">
          <div class="slide-badge-tag" id="current-slide-badge">PROJECT OVERVIEW</div>
        </div>

        <div class="footer-center">
          <button id="btn-prev" class="btn-nav" title="Previous Slide">
            <i class="ph ph-caret-left"></i> Prev
          </button>
          
          <button id="btn-play" class="btn-nav btn-play" title="Auto Slideshow Toggle">
            <i class="ph ph-play" id="play-icon"></i> <span id="play-text">Auto Play</span>
          </button>

          <button id="btn-next" class="btn-nav btn-primary" title="Next Slide">
            Next <i class="ph ph-caret-right"></i>
          </button>
        </div>

        <div class="footer-right">
          <div class="kbd-shortcuts-hint">
            <span><kbd>←</kbd> <kbd>→</kbd> Navigate</span>
            <span><kbd>Space</kbd> Next</span>
            <span><kbd>O</kbd> Grid</span>
            <span><kbd>F</kbd> Fullscreen</span>
          </div>
        </div>
      </div>
    </footer>

    <!-- Slide Grid Modal -->
    <div class="modal-overlay" id="grid-modal-overlay">
      <div class="modal-content glass-modal">
        <div class="modal-header">
          <h2><i class="ph ph-grid-four"></i> Slide Overview (17 Slides)</h2>
          <button class="btn-close" id="btn-close-grid">&times;</button>
        </div>
        <div class="slides-grid-container" id="slides-grid-container">
          <!-- 21 Thumbnails dynamically generated -->
        </div>
      </div>
    </div>

    <!-- Edit Slide Modal -->
    <div class="modal-overlay" id="edit-modal-overlay">
      <div class="modal-content glass-modal modal-edit">
        <div class="modal-header">
          <h2><i class="ph ph-pencil-simple"></i> Edit Current Slide</h2>
          <button class="btn-close" id="btn-close-edit">&times;</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="edit-badge">Category Badge</label>
            <input type="text" id="edit-badge" class="form-input" />
          </div>
          <div class="form-group">
            <label for="edit-title">Slide Title</label>
            <input type="text" id="edit-title" class="form-input" />
          </div>
          <div class="form-group">
            <label for="edit-subtitle">Subtitle</label>
            <input type="text" id="edit-subtitle" class="form-input" />
          </div>
          <div class="form-group">
            <label for="edit-content">Slide HTML Content</label>
            <textarea id="edit-content" class="form-textarea" rows="6"></textarea>
          </div>
          <div class="form-group">
            <label for="edit-notes">Presenter Notes</label>
            <textarea id="edit-notes" class="form-textarea" rows="3"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button id="btn-save-edit" class="btn-nav btn-primary">Save Changes</button>
        </div>
      </div>
    </div>

    <!-- Image Lightbox Zoom Modal -->
    <div class="modal-overlay" id="lightbox-modal-overlay">
      <div class="lightbox-modal-content">
        <button class="lightbox-btn-close" id="btn-close-lightbox" title="Close Image (Esc)">&times;</button>
        <img id="lightbox-image" src="" alt="Zoomed Diagram" />
      </div>
    </div>

  </div>

</body>
</html>
